# Builds the installable app (APK) on GitHub's servers, for free.
# Runs on every upload/push, or by hand: Actions tab → "Build APK" → Run workflow.
# When it finishes, the APK is under the run's "Artifacts" (MarqueeLens-apk).
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Your fixed signing key, from the repository's secrets (Settings → Secrets and variables → Actions)
      - name: Use your signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > app/marquee.keystore
            echo "Signing with your fixed key: new builds install as updates."
          else
            echo "::warning::No SIGNING_KEY secret: this build gets a one-off key and won't install over an earlier build."
          fi

      - name: Build the APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show which key signed it
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true
          rm -f app/marquee.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: MarqueeLens-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
